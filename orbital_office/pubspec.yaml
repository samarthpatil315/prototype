name: orbital_office
description: "ORBITAL OFFICE — Work Smarter. Create Better. By ORBITAL.STUDIO.3"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  # Backend (optional at runtime — app runs fully in demo/offline mode without it)
  supabase_flutter: ^2.8.0
  # Offline persistence (SQLite, no code generation required)
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.0
  # UI / charts / typography
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  # Documents, PDF, files
  pdf: ^3.11.1
  printing: ^5.13.4
  file_picker: ^8.1.7
  share_plus: ^10.1.2
  csv: ^6.0.0
  excel: ^4.0.6
  image_picker: ^1.1.2
  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/orbital_poster.png
